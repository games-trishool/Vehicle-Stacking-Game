<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#203d30" />
  <meta name="description" content="Find your balance. Stack beautifully crafted 3D vehicles, explore six worlds, and build your next personal best." />
  <title>Stack Vehicles — The art of balance</title>
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preload" as="image" href="/loading-forest.png" />
  <link rel="stylesheet" href="/src/loading.css" />
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-dial">
      <div class="loading-emblem" aria-hidden="true">
        <svg viewBox="0 0 50 78" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round">
          <defs>
            <g id="loading-car">
              <path d="M5 20v-7l4-4 4-7h24l4 7 4 4v7h-4v-3H9v3z M10 10h30"/>
              <path d="M10 14h5m20 0h5"/>
            </g>
          </defs>
          <use href="#loading-car" y="2"/><use href="#loading-car" y="27"/><use href="#loading-car" y="52"/>
        </svg>
      </div>
      <span class="loading-kicker">Stack Vehicles</span>
      <strong class="loading-title">STACKLINE</strong>
      <span id="loading-status">Preparing your world</span>
      <div class="loading-track" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><i id="loading-progress"></i></div>
      <span id="loading-percent">4%</span>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
